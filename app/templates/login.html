<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Warehouse Management - Login</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        min-height: 100vh;

        background: #f5f7fb;

        display: flex;
        justify-content: center;
        align-items: center;
      }

      .login-container {
        width: 100%;
        max-width: 420px;
        padding: 20px;
      }

      .login-card {
        background: white;

        padding: 35px;

        border-radius: 12px;

        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }

      .logo {
        text-align: center;

        font-size: 45px;

        margin-bottom: 10px;
      }

      h1 {
        text-align: center;

        color: #111827;

        margin-bottom: 8px;
      }

      .subtitle {
        text-align: center;

        color: #6b7280;

        font-size: 14px;

        margin-bottom: 30px;
      }

      .form-group {
        margin-bottom: 18px;
      }

      label {
        display: block;

        margin-bottom: 7px;

        color: #374151;

        font-weight: 600;
      }

      input {
        width: 100%;

        padding: 12px;

        border: 1px solid #d1d5db;

        border-radius: 7px;

        font-size: 15px;

        outline: none;
      }

      input:focus {
        border-color: #2563eb;

        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      }

      /* BIG LOGIN BUTTON */

      #loginBtn {
        width: 100%;

        height: 55px;

        margin-top: 15px;

        background: linear-gradient(135deg, #2563eb, #06b6d4);

        color: white;

        border: none;

        border-radius: 10px;

        font-size: 20px;

        font-weight: 700;

        cursor: pointer;

        box-shadow: 0 5px 15px rgba(37, 99, 235, 0.35);

        transition: all 0.3s ease;
      }

      #loginBtn:hover {
        transform: translateY(-2px);

        background: linear-gradient(135deg, #1d4ed8, #0891b2);

        box-shadow: 0 8px 20px rgba(37, 99, 235, 0.5);
      }

      #loginBtn:active {
        transform: scale(0.98);
      }

      #loginBtn:disabled {
        opacity: 0.7;

        cursor: not-allowed;

        transform: none;
      }

      .message {
        display: none;

        margin-bottom: 18px;

        padding: 10px;

        border-radius: 6px;

        text-align: center;

        font-size: 14px;

        font-weight: 600;
      }

      .message.error {
        display: block;

        background: #fee2e2;

        color: #b91c1c;
      }

      .message.success {
        display: block;

        background: #dcfce7;

        color: #166534;
      }

      .show-password {
        display: flex;

        align-items: center;

        gap: 8px;

        margin-top: 8px;

        font-size: 13px;

        color: #6b7280;
      }

      .show-password input {
        width: auto;

        cursor: pointer;
      }

      .show-password label {
        margin: 0;

        font-weight: normal;

        cursor: pointer;
      }

      .forgot-password {
        text-align: right;

        margin-bottom: 20px;
      }

      .forgot-password a {
        color: #2563eb;

        text-decoration: none;

        font-size: 13px;
      }

      .forgot-password a:hover {
        text-decoration: underline;
      }

      .back-dashboard {
        text-align: center;

        margin-top: 15px;
      }

      .back-dashboard a {
        color: #2563eb;

        text-decoration: none;

        font-size: 14px;
      }

      .footer-text {
        text-align: center;

        margin-top: 22px;

        color: #6b7280;

        font-size: 13px;
      }

      @media (max-width: 500px) {
        .login-container {
          padding: 15px;
        }

        .login-card {
          padding: 25px 20px;
        }
      }
    </style>
  </head>
</html>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                📦
            </div>


            <h1>
                Warehouse Management
            </h1>


            <p class="subtitle">
                Login to access your warehouse dashboard
            </p>


            <!-- MESSAGE -->

            <div id="loginMessage"
                 class="message">
            </div>


            <!-- LOGIN FORM -->

            <form id="loginForm">


                <!-- USERNAME -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >


                    <!-- SHOW PASSWORD -->

                    <div class="show-password">

                        <input
                            type="checkbox"
                            id="showPassword"
                        >

                        <label for="showPassword">
                            Show Password
                        </label>

                    </div>

                </div>


                <!-- FORGOT PASSWORD -->

                <div class="forgot-password">

                    <a href="#"
                       onclick="forgotPassword(event)">
                        Forgot Password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    id="loginBtn">

                    Login

                </button>

            </form>


            <!-- BACK TO DASHBOARD -->

            <div class="back-dashboard">

                <a href="/">
                    ← Back to Dashboard
                </a>

            </div>


            <p class="footer-text">
                Warehouse Management System
            </p>

        </div>

    </div>
    <script>

        /* =========================
           SHOW / HIDE PASSWORD
        ========================= */

        document
            .getElementById("showPassword")
            .addEventListener("change", function () {

                const password =
                    document.getElementById("password");

                if (this.checked) {

                    password.type = "text";

                } else {

                    password.type = "password";

                }

            });


        /* =========================
           LOGIN FUNCTION
        ========================= */

        document
            .getElementById("loginForm")
            .addEventListener("submit", async function (event) {

                event.preventDefault();


                const username =
                    document
                        .getElementById("username")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value
                        .trim();


                const message =
                    document.getElementById("loginMessage");


                const loginBtn =
                    document.getElementById("loginBtn");


                /* CLEAR MESSAGE */

                message.className = "message";
                message.innerText = "";


                /* CHECK INPUT */

                if (!username || !password) {

                    message.className =
                        "message error";

                    message.innerText =
                        "Please enter username and password.";

                    return;
                }


                /* BUTTON LOADING */

                loginBtn.disabled = true;

                loginBtn.innerText =
                    "Logging in...";


                try {

                    /* SEND REQUEST TO FLASK */

                    const response =
                        await fetch("/login", {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                username: username,

                                password: password

                            })

                        });


                    const data =
                        await response.json();


                    console.log(
                        "Login response:",
                        data
                    );


                    /* =========================
                       LOGIN SUCCESS
                    ========================= */

                    if (response.ok) {

                        message.className =
                            "message success";

                        message.innerText =
                            "Login successful!";


                        /* SAVE USER */

                        localStorage.setItem(
                            "user",
                            JSON.stringify(data.user)
                        );


                        /* GO TO DASHBOARD */

                        setTimeout(function () {

                            window.location.href = "/";

                        }, 700);

                    }


                    /* =========================
                       LOGIN FAILED
                    ========================= */

                    else {

                        message.className =
                            "message error";

                        message.innerText =
                            data.message ||
                            "Invalid username or password.";

                    }

                }


                /* =========================
                   SERVER ERROR
                ========================= */

                catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );


                    message.className =
                        "message error";

                    message.innerText =
                        "Server connection failed.";

                }


                /* RESTORE BUTTON */

                loginBtn.disabled = false;

                loginBtn.innerText =
                    "Login";

            });


        /* =========================
           FORGOT PASSWORD
        ========================= */

        function forgotPassword(event) {

            event.preventDefault();


            const message =
                document.getElementById("loginMessage");


            message.className =
                "message error";


            message.innerText =
                "Please contact the administrator to reset your password.";

        }

    </script>


</body>

</html>
